# Rebuilds the ZIPs on every push to main and replaces the ones attached to the
# latest GitHub Release, so the download links in README.md always serve the
# current skills.
name: Update release ZIPs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-zips
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the skills and build the ZIPs
        run: bash scripts/package.sh

      - name: Replace the ZIPs on the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh release view --json tagName --jq .tagName)"
          echo "Uploading to release $tag"
          gh release upload "$tag" dist/*.zip --clobber
